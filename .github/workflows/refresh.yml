name: Refresh Venom Stock

on:
  # Run every Monday at 08:00 UTC (09:00 BST)
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit the updated index.html

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh stock from Linnworks
        env:
          LINNWORKS_APP_ID:     ${{ secrets.LINNWORKS_APP_ID }}
          LINNWORKS_APP_SECRET: ${{ secrets.LINNWORKS_APP_SECRET }}
          LINNWORKS_TOKEN:      ${{ secrets.LINNWORKS_TOKEN }}
        run: python refresh_stock.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add index.html
          git diff --cached --quiet || git commit -m "chore: refresh Venom stock $(date -u +'%Y-%m-%d')"
          git push
